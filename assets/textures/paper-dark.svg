<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="fiber">
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.9" numOctaves="3" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="fuzz">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.4" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#1d2333"/>
  <!-- fine paper grain -->
  <rect width="200" height="200" filter="url(#fiber)" opacity="0.06"/>
  <!-- soft fiber streaks -->
  <rect width="200" height="200" filter="url(#fuzz)" opacity="0.05"/>
</svg>
